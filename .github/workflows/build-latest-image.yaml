name: Build Docker Image Archives

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Generate image tag
        id: meta
        run: echo "image_tag=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            archive_name: astrbot-t2i-service-amd64.tar
            artifact_name: astrbot-t2i-service-amd64
          - platform: linux/arm64
            archive_name: astrbot-t2i-service-arm64.tar
            artifact_name: astrbot-t2i-service-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image archive
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --tag astrbot-t2i-service:${{ needs.prepare.outputs.image_tag }} \
            --output type=docker,dest=${{ matrix.archive_name }} \
            .

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error
          retention-days: 7
